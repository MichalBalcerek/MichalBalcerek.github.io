cv:
  name: Michał Balcerek
  label: Mathematician
  email: michal.balcerek@pwr.edu.pl
  website: https://michalbalcerek.github.io/
  summary: >-
    Assistant Professor at the Faculty of Pure and Applied Mathematics, Wrocław University of Science and Technology.
    My research concerns stochastic processes, anomalous diffusion and statistical inference,
    connecting models of memory, heterogeneity and spatial dependence with observed trajectories.
    Applications include single-particle tracking in biological systems, environmental time series,
    and financial and actuarial models.

  sections:
    Research profile:
      - bullet: >-
          **Random and evolving memory:** fractional and multifractional Brownian motion,
          random Hurst exponents, telegraphic multifractional models, switching dynamics and ergodicity.
      - bullet: >-
          **Multidimensional diffusion:** dependent spatial components, covariance and spectral analysis,
          turning-angle statistics and anisotropy in molecular trajectories.
      - bullet: >-
          **Statistical identification:** testing fractional models, discriminating Gaussian processes with
          quadratic-form statistics, assessing Gaussianity and accounting for measurement noise.
      - bullet: >-
          **Trajectory analysis:** change-point detection, parameter estimation, hidden Markov models and
          the collaborative CINNAMON approach combining statistical and neural-network methods.
      - bullet: >-
          **Applied stochastic modelling:** heterogeneous membrane and cytoplasmic diffusion, environmental
          measurements, subordinated option-pricing models and machine learning for catastrophe bonds.

